# Security response headers — included from EVERY location block, because
# nginx's add_header directives do not inherit into a location that declares
# its own add_header (the per-location Cache-Control lines below).
# This file is the single source of truth for CSP: index.html carries no
# <meta http-equiv="Content-Security-Policy">. See docs/CSP.md.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# No 'unsafe-inline'/'unsafe-eval' in script-src: all JS is bundled or comes
# from the explicit allowlist; GA bootstraps via /ga-loader.js (external file).
# 'wasm-unsafe-eval' is required by @google/model-viewer (WebAssembly).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://www.googletagmanager.com https://plausible.io https://cdn.usefathom.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://challenges.cloudflare.com https://www.googletagmanager.com https://plausible.io https://cdn.usefathom.com https://*.ingest.sentry.io https://modelviewer.dev https://raw.githubusercontent.com; frame-src https://challenges.cloudflare.com https://www.google.com https://maps.google.com; media-src 'self' https://*.supabase.co https://modelviewer.dev https://raw.githubusercontent.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests;" always;
