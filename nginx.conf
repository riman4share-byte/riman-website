server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers + CSP live in security-headers.conf and are included
    # from every location below: nginx does NOT inherit server-level
    # add_header into locations that declare their own add_header.

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # SPA routing: prerendered route directories first, then index.html
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        log_not_found off;
    }

    location ~* (\.env|\.git|composer\.json|package\.json|tsconfig) {
        deny all;
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
